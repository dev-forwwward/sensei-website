name: Update README Features + CSS import versions

on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "css/**"
  workflow_dispatch: {}

# Avoid two runs racing to commit against the same ref.
concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # Skip commits made by this job itself, just in case.
    if: "!contains(github.event.head_commit.message, '[skip readme]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate README features section
        run: node scripts/generate-readme.js

      - name: Stamp local CSS @imports with content hashes
        run: node scripts/version-css-imports.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md css; then
            echo "README.md and css/ unchanged, nothing to commit."
            exit 0
          fi

          # Remember which CSS files this job rewrote, for the purge step below
          git diff --name-only -- css > /tmp/changed-css.txt

          git add README.md css
          git commit -m "chore: auto-update README features + CSS import versions [skip readme]"
          git push origin HEAD:main

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so
      # purge-jsdelivr.yml won't run for the commit above: purge here instead.
      - name: Purge jsDelivr for rewritten CSS
        run: |
          [ -s /tmp/changed-css.txt ] || exit 0
          while IFS= read -r file; do
            url="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/${file}"
            printf 'Purging %s ... ' "$file"
            curl -fsS "$url" >/dev/null && echo OK || echo FAILED
          done < /tmp/changed-css.txt
