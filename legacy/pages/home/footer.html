<!------------- Marquee Clients ------------->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const marqueeContainer = document.querySelector('.home-intro-clients.marquee-container');
    const marqueeContent = document.querySelector('.marquee-content');
    const clientsList = document.querySelector('.clients-list');

    // Clone the clients list multiple times to ensure smooth looping
    const cloneCount = Math.ceil(window.innerWidth / clientsList.offsetWidth) + 1;
    for (let i = 0; i < cloneCount; i++) {
      const clone = clientsList.cloneNode(true);
      marqueeContent.appendChild(clone);
    }

    // Set up the GSAP animation
    let animation;
    function setupMarquee() {
      // Kill any existing animation
      if (animation) animation.kill();

      // Calculate the total width of all cloned lists
      const totalWidth = marqueeContent.offsetWidth;

      // Create the animation
      animation = gsap.to(marqueeContent, {
        x: -totalWidth / cloneCount,
        ease: 'none',
        duration: 10, // Adjust this value to control speed
        repeat: -1,
        onRepeat: () => {
          gsap.set(marqueeContent, { x: 0 });
        },
      });
    }

    // Initial setup
    setupMarquee();

    // Pause on hover
    marqueeContainer.addEventListener('mouseenter', () => {
      gsap.to(animation, { timeScale: 0, duration: 0.5 });
    });
    marqueeContainer.addEventListener('mouseleave', () => {
      gsap.to(animation, { timeScale: 1, duration: 0.5 });
    });

    // Update on window resize
    //window.addEventListener('resize', gsap.utils.debounce(setupMarquee, 100));
  });
</script>

<script>
  $(document).ready(function () {
    // Set up variables for cycling and progress
    var industryItems = $('.home-industries-names-item');
    var totalItems = industryItems.length;
    var currentIndex = 0;
    var cycleInterval = 3000; // Time to display each industry (in milliseconds)
    var cycling = true; // Enable automatic cycling by default

    // Initially hide all sub-industry labels and images, and show the first one
    $('.home-sub-industry-labels-item').hide();
    $('.industry-image').hide(); // Hide all images initially
    var firstIndustryID = industryItems.first().attr('data-industry-id');
    $('.home-sub-industry-labels-item[data-industry-id="' + firstIndustryID + '"]').show();
    $('.industry-image[data-industry-id="' + firstIndustryID + '"]').css({ display: 'block', opacity: 1 }); // Show first image by default
    updateProgressBar(0); // Initialize progress bar

    // Add active state to the first industry name
    $('.industry-name[data-industry-id="' + firstIndustryID + '"]').addClass('active');

    // Function to update the progress bar width based on the current index
    function updateProgressBar(index) {
      var progressWidth = (index / totalItems) * 100;
      $('.progress-bar').css('width', progressWidth + '%');
    }

    // Function to hide all images and show the one with the matching data-industry-id
    function showImageForIndustry(industryID) {
      // Hide all images and set opacity to 0
      $('.industry-image').css({ opacity: 0, display: 'none' });

      // Show the matching image by setting opacity to 1 and display to block
      $('.industry-image[data-industry-id="' + industryID + '"]').css({ display: 'block', opacity: 1 });
    }

    // Function to cycle through industries
    function cycleIndustries() {
      if (cycling) {
        // Move to the next industry
        currentIndex = (currentIndex + 1) % totalItems;
        var industryID = industryItems.eq(currentIndex).attr('data-industry-id');

        // Hide all sub-industry labels and images
        $('.home-sub-industry-labels-item').hide();
        $('.industry-image').hide();

        // Show the corresponding sub-industry labels and images
        $('.home-sub-industry-labels-item[data-industry-id="' + industryID + '"]').show();
        showImageForIndustry(industryID); // Show corresponding image

        // Remove active class from all industry names and add to the current one
        $('.industry-name').removeClass('active');
        $('.industry-name[data-industry-id="' + industryID + '"]').addClass('active');

        // Update progress bar
        updateProgressBar(currentIndex);
      }
    }

    // Set up an interval to automatically cycle through industries
    var cycleTimer = setInterval(cycleIndustries, cycleInterval);

    // Hover functionality for industry names (manual control)
    industryItems.hover(
      function () {
        cycling = false; // Pause automatic cycling when user hovers

        var industryID = $(this).attr('data-industry-id');
        currentIndex = $(this).index(); // Update current index based on hover

        // Hide all sub-industry labels and images
        $('.home-sub-industry-labels-item').hide();
        $('.industry-image').hide();

        // Show the corresponding sub-industry labels and images
        $('.home-sub-industry-labels-item[data-industry-id="' + industryID + '"]').show();
        showImageForIndustry(industryID); // Show corresponding image

        // Remove active class from all industry names and add to the hovered one
        $('.industry-name').removeClass('active');
        $('.industry-name[data-industry-id="' + industryID + '"]').addClass('active');

        // Update progress bar
        updateProgressBar(currentIndex);
      },
      function () {
        cycling = true; // Resume automatic cycling when hover ends
      }
    );
  });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<script>
$(document).ready(function () {
  gsap.registerPlugin(ScrollTrigger);

  var $video = $('.video-hero-wrapper--inner');
  var $title = $('.home-hero-wrapper h1');
  var isDesktop = window.innerWidth >= 768;

  var desiredWidth = 425;
  var scaleFactor = isDesktop ? desiredWidth / window.innerWidth : 0.5;

  // Anchor the scale so the small video ends flush with the container's right edge
  // Anchor the scale so the small video ends flush with the container's left edge
  if (window.innerWidth > 991) {
    var container = document.querySelector('.section_home-intro .container-xl');
    var videoRect = $video[0].getBoundingClientRect();
    var targetLeft = container.getBoundingClientRect().left - videoRect.left;
    var originX = targetLeft / (1 - scaleFactor);
    gsap.set($video, { transformOrigin: originX + 'px center' });
  }

  var endScrollPoint = $('.section_home-hero').outerHeight() * 0.5;
  var textEl = document.querySelector('.section_home-intro .container-l');
  var elementHeight = textEl ? textEl.offsetHeight : 0;
  endScrollPoint = endScrollPoint + elementHeight / 2 + 35;
  endScrollPoint = window.innerWidth > 991 ? endScrollPoint : endScrollPoint - 200;

  gsap
    .timeline({
      scrollTrigger: {
        trigger: '.section_home-hero',
        start: 'top top',
        end: () => `+=${endScrollPoint}`,
        scrub: true,
        pin: $video[0],
        pinSpacing: true,
        onUpdate: function (self) {
          if (self.progress === 1) {
            gsap.set($video, { position: 'relative', top: 'auto', left: 'auto', xPercent: 0, yPercent: 0 });
          }
        },
        onLeaveBack: function () {
          gsap.set($video, { clearProps: 'position, top, left, xPercent, yPercent' });
        },
      },
    })
    .to($video, { scale: scaleFactor, left: 0, ease: 'power2.out' })
    .to($title, { opacity: 0, ease: 'power2.out' }, '<');
});
</script>
<style>
  @media (max-width: 991px) {
    .video-hero-wrapper--inner {
      transform-origin: center;
    }
    .section_home-intro {
      height: auto;
      padding-top: 75vw;
    }
  }
</style>
