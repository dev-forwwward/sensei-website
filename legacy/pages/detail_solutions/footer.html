<script>
document.addEventListener('DOMContentLoaded', function () {
  const featuresSwiper = new Swiper('.features-collection', {
    slidesPerView: 'auto',
    grabCursor: true,
    pagination: {
      el: '.progress-dots-wrapper-horizontal',
      clickable: true,
    },
    effect: 'coverflow',
    coverflowEffect: {
      rotate: 0,
      scale: 0.85,
      slideShadows: false,
    },
  });

  const container = document.querySelector('.section_solution-features');

  ScrollTrigger.create({
    trigger: container,
    pin: true,
    scrub: 2,
    start: 'top top',
    onUpdate: (self) => {
      const progress = self.progress;

      const currentIndex = Math.round(progress * (featuresSwiper.slides.length - 1));
      featuresSwiper.slideTo(currentIndex);
    },
  });

  const industriesCollections = document.querySelectorAll('.industries-collection');

  const industriesSwiper = new Swiper(industriesCollections[0], {
    slidesPerView: 1,
    direction: 'vertical',
    allowTouchMove: false,
  });

  ScrollTrigger.create({
    trigger: '.section_solution-industry',
    pin: true,
    scrub: 2,
    start: 'top top',
    onUpdate: (self) => {
      const progress = self.progress;

      const currentIndex = Math.round(progress * (industriesSwiper.slides.length - 1));
      industriesSwiper.slideTo(currentIndex);

      const titleContainer = document.querySelector('.solution-industry-title');
      const title = document.querySelector('.solution-industry-txt');
      const titleContainerHeight = titleContainer.clientHeight;
      const padding = parseFloat(window.getComputedStyle(titleContainer).paddingTop) + parseFloat(window.getComputedStyle(titleContainer).paddingBottom);
      const targetPosition = titleContainerHeight - padding - title.clientHeight;

      gsap.to('.solution-industry-txt', {
        y: targetPosition * progress,
      });
    },
  });
});
</script>

<script>
// Animation of anchoring the section so that it is fixed throughout the animation

setTimeout(function() {


  let pinAnimGsap = gsap.timeline({
    scrollTrigger: {
      trigger: '.section_solution-tech', 
      start: 'top top',  
      end: '+=120%',     
      scrub: true,       
      pin: true,
    }
  });




// Animation of text movement from bottom to top
const oneElement = document.querySelector('.technology-text-list');
const oneInsideElements = document.querySelectorAll('.technology-text-item');

function calculateSpaceBetweenPositions(containerHeight, elementHeight, elementsCount) {
  const totalSpace = containerHeight - elementHeight * elementsCount;
  const spaceBetween = totalSpace / (elementsCount - 1);
  return Array.from({ length: elementsCount }, (_, index) => index * (elementHeight + spaceBetween));
}


  let animGsap = gsap.timeline({
    scrollTrigger: {
      trigger: '.section_solution-tech',
      start: 'top 20%',
      end: 'bottom 30%',
      scrub: true,
    }
  });



const containerHeight = oneElement.offsetHeight;
const elementHeight = oneInsideElements[0].offsetHeight;
const spaceBetweenPositions = calculateSpaceBetweenPositions(containerHeight, elementHeight, oneInsideElements.length);

gsap.set(oneElement, { 
  position: 'relative',
  overflow: 'hidden'
});

// Percentage for indentation when text is at the bottom, not in active state
const marginPercentStep = 7; // For example, a step of 7%

// Set initial positions of elements in reverse order
oneInsideElements.forEach((element, index) => {
  const reverseIndex = oneInsideElements.length - 1 - index;
  const marginBottomPercent = reverseIndex * marginPercentStep;
  gsap.set(element, { 
    position: 'absolute',
		bottom: `${marginBottomPercent}%`, 
    left: 0,
    right: 0,
    zIndex: index + 1
  });
});


oneInsideElements.forEach((element, index) => {
  const targetTop = spaceBetweenPositions[index];
  animGsap.to(element, {
    top: targetTop,
    bottom: 'auto',
    ease: 'power1.out',
    duration: 3,
  }, index * 6);
});

animGsap.to({}, {duration: 0.5});
