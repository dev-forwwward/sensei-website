<!-- FWD GitHub Repo Scripts (?dev=true → local Live Server on :5500) -->
<script>
(function () {
  var isDev = new URLSearchParams(window.location.search).get('dev') === 'true';

  var localSrc = 'http://127.0.0.1:5500/js/script-loader.js?v=' + Date.now();
  var cdnSrc = 'https://cdn.jsdelivr.net/gh/dev-forwwward/sensei-website@main/js/script-loader.js?v=' + Date.now();

  var script = document.createElement('script');
  script.type = 'module';
  script.src = isDev ? localSrc : cdnSrc;

  script.onerror = function () {
    if (isDev) {
      console.warn('Local JS failed, loading CDN fallback...');
      var fallback = document.createElement('script');
      fallback.type = 'module';
      fallback.src = cdnSrc;
      document.body.appendChild(fallback);
    }
  };

  document.body.appendChild(script);
})();
</script>
