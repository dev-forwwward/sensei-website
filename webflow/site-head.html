<!-- FWD GitHub Repo Styles (?dev=true → local Live Server on :5500)
     document.write makes this a normal parser-inserted stylesheet: every browser waits
     for it before first paint, so page CSS that hides elements until JS reveals them
     (css/pages/*.css) works like the inline <style> it replaced. -->
<script>
(function () {
  var isDev = new URLSearchParams(window.location.search).get('dev') === 'true';

  var localHref = 'http://127.0.0.1:5500/css/styles.css?v=' + Date.now();
  var cdnHref = 'https://cdn.jsdelivr.net/gh/dev-forwwward/sensei-website@' + window.FWD_VERSION + '/css/styles.css';

  // Dev only: local server down → load the CDN copy instead
  window.fwdCssFallback = function () {
    console.warn('Local CSS failed, loading CDN fallback...');
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = cdnHref;
    document.head.appendChild(link);
  };

  document.write(isDev
    ? '<link rel="stylesheet" href="' + localHref + '" onerror="fwdCssFallback()">'
    : '<link rel="stylesheet" href="' + cdnHref + '">');
})();
</script>
