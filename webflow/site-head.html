<!-- FWD GitHub Repo Styles (?dev=true → local Live Server on :5500) -->
<script>
(function () {
  var isDev = new URLSearchParams(window.location.search).get('dev') === 'true';

  var localHref = 'http://127.0.0.1:5500/css/styles.css?v=' + Date.now();
  var cdnHref = 'https://cdn.jsdelivr.net/gh/dev-forwwward/sensei-website@main/css/styles.css?v=' + Date.now();

  function loadCSS(href) {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = href;
    // Script-inserted stylesheets aren't render-blocking by default; this keeps
    // the legacy layout rules from flashing in (Chromium; ignored elsewhere)
    link.setAttribute('blocking', 'render');
    document.head.appendChild(link);
    return link;
  }

  if (isDev) {
    var link = loadCSS(localHref);

    link.onerror = function () {
      console.warn('Local CSS failed, loading CDN fallback...');
      loadCSS(cdnHref);
    };
  } else {
    loadCSS(cdnHref);
  }
})();
</script>
